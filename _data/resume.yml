- type: projects
  name: 项目经历
  content:
  - title: 基于三维生成模型的单目人头重建
    duration: 2024年6月 - 至今
    detail: 
      项目概况：结合三维生成模型，从单目RGB图片/视频中实时重建完整人头几何及纹理。
      主要工作：使用LoRA微调三维生成模型，为重建提供几何先验。使用3DMMs做面部注册，为重建结果提供驱动信号，引导神经隐式表示形变。
  - title: 基于联邦学习的异常监测
    # summary: Projects' introduction or summary
    duration: 2021年10月 - 2022年4月
    detail:
      项目概况：使用分布式设计，将异常检测任务拆分为多个子任务。
      主要工作：在用户端部署神经网络，分析异常，将模型参数同一回收到根服务器，只传参数不传数据，在保证用户数据隐私的情况下，检测数据异常。
